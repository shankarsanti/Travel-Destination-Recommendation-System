{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-container">
  <div class="glass auth-card">
    <div class="text-center">
      <div style="font-size:3rem;margin-bottom:12px">🌟</div>
      <h2>Create Account</h2>
      <p class="subtitle">Join TravelSmart and start exploring</p>
    </div>
    <form method="POST">
      <div class="form-group"><label>Full Name</label><input type="text" name="full_name" class="form-control" placeholder="Your full name" required></div>
      <div class="form-group"><label>Username</label><input type="text" name="username" class="form-control" placeholder="Choose a username" required></div>
      <div class="form-group"><label>Email</label><input type="email" name="email" class="form-control" placeholder="your@email.com" required></div>
      <div class="form-group"><label>Password</label><input type="password" name="password" class="form-control" placeholder="Create a password" required minlength="6"></div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account →</button>
    </form>
    <p class="text-center mt-3" style="font-size:0.9rem;color:var(--text-secondary)">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
  </div>
</div>
{% endblock %}
