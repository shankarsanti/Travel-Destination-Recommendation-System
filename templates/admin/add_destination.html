{% extends 'base.html' %}
{% block title %}{{ 'Edit' if edit else 'Add' }} Destination{% endblock %}
{% block content %}
<div class="page-header"><h1>{{ '✏️ Edit' if edit else '➕ Add' }} Destination</h1></div>
<div class="container" style="max-width:800px">
  <div class="glass detail-section">
    <form method="POST">
      <div class="form-row">
        <div class="form-group"><label>Name</label><input type="text" name="name" class="form-control" value="{{ dest.name if edit else '' }}" required></div>
        <div class="form-group"><label>State</label><input type="text" name="state" class="form-control" value="{{ dest.state if edit else '' }}" required></div>
      </div>
      <div class="form-group"><label>Description</label><textarea name="description" class="form-control" rows="4" required>{{ dest.description if edit else '' }}</textarea></div>
      <div class="form-row">
        <div class="form-group"><label>Travel Type</label>
          <select name="travel_type" class="form-control">
            {% for t in ['beach','adventure','historical','nature','cultural','wildlife','pilgrimage','hill_station'] %}
            <option value="{{ t }}" {{ 'selected' if edit and dest.travel_type == t }}>{{ t | replace('_',' ') | title }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group"><label>Budget Category</label>
          <select name="budget_category" class="form-control">
            {% for b in ['budget','moderate','luxury'] %}
            <option value="{{ b }}" {{ 'selected' if edit and dest.budget_category == b }}>{{ b | title }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Best Season</label>
          <select name="best_season" class="form-control">
            {% for s in ['summer','winter','monsoon','spring','all'] %}
            <option value="{{ s }}" {{ 'selected' if edit and dest.best_season == s }}>{{ s | title }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group"><label>Duration (Days)</label><input type="number" name="duration_days" class="form-control" value="{{ dest.duration_days if edit else 3 }}" min="1"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Cost Estimate (₹)</label><input type="number" name="cost_estimate" class="form-control" value="{{ dest.cost_estimate if edit else 10000 }}" min="0"></div>
        <div class="form-group"><label>Rating</label><input type="number" name="rating" class="form-control" value="{{ dest.rating if edit else 4.0 }}" min="0" max="5" step="0.1"></div>
      </div>
      <div class="form-group"><label>Image URL</label><input type="text" name="image_url" class="form-control" value="{{ dest.image_url if edit else 'default_dest.jpg' }}"></div>
      <div class="form-group"><label>Attractions (comma-separated)</label><input type="text" name="attractions" class="form-control" value="{{ dest.attractions if edit else '' }}"></div>
      <div class="form-group"><label>Highlights (comma-separated)</label><input type="text" name="highlights" class="form-control" value="{{ dest.highlights if edit else '' }}"></div>
      <div class="form-group"><label>How to Reach</label><textarea name="how_to_reach" class="form-control" rows="2">{{ dest.how_to_reach if edit else '' }}</textarea></div>
      <div class="form-group"><label>Best Time Detail</label><textarea name="best_time_detail" class="form-control" rows="2">{{ dest.best_time_detail if edit else '' }}</textarea></div>
      <div class="flex gap-2">
        <button type="submit" class="btn btn-primary btn-lg">{{ 'Update' if edit else 'Add' }} Destination</button>
        <a href="{{ url_for('admin_destinations') }}" class="btn btn-outline btn-lg">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
